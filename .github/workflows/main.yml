name: Build and push images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cibox
    permissions:
      contents: read
      packages: write
    env:
      PR_NUMBER: ${{ github.event.number }}
      PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build image and publishing script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix_store=$(nix config show --json | jq -r '.store.value')
          if [[ "$nix_store" == unix://* ]]; then
            export NIX_DAEMON_SOCKET_PATH="${nix_store#unix://}"
            export NIX_REMOTE=daemon
            NIX_CONFIG=$(printf '%s\n' "${NIX_CONFIG:-}" | sed '/^[[:space:]]*store[[:space:]]*=/d')
          fi
          export NIX_CONFIG="${NIX_CONFIG:-}
          access-tokens = github.com=$GITHUB_TOKEN"
          nix build .#checks.x86_64-linux.pushImages --out-link result-pushImages --print-build-logs

      - name: Push images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/containers-auth.json
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: ./result-pushImages/bin/push-images

name: Test and publish image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go build ./cmd/database-gateway
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dialohq/tailscale-database-gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
      - name: Build image
        run: nix build .#dockerImage --print-build-logs
      - name: Load and smoke-test image
        run: |
          docker load --input result
          test "$(docker image inspect "$IMAGE:local" --format '{{.Config.User}}')" = '1000:1000'
          status=0
          docker run --rm --network none --read-only --cap-drop ALL "$IMAGE:local" > smoke.log 2>&1 || status=$?
          cat smoke.log
          test "$status" -eq 1
          grep -F 'DATABASE_GATEWAY_CONFIG_FILE is required' smoke.log
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:local" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag "$IMAGE:local" "$IMAGE:latest"
          docker push "$IMAGE:latest"
